    description: 탈퇴 대기 계정의 탈퇴를 취소하고 로그인 상태를 복구한다.
    auth_required: false
    success_status: [200]
    error_cases: [network_error, invalid_cancel_token, server_error]

  - id: API_GET_ONBOARDING_CKD
    method: GET
