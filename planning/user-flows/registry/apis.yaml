apis:
  - id: API_GET_MOBILE_POLICY
    method: GET
    path: /public/mobile-policy
    description: 앱 실행 전 서버 권위 정책을 조회한다.
    auth_required: false
    success_status: [200]
    error_cases:
      [
        network_error,
        unsupported_contract,
        maintenance,
        force_update,
        server_error,
      ]

  - id: API_AUTH_SOCIAL_LOGIN
    method: POST
    path: /auth/social-login
    description: Google, Apple, Kakao ID token으로 로그인한다.
    auth_required: false
    success_status: [200]
    error_cases:
      [
        network_error,
        invalid_provider,
        invalid_token,
        social_link_required,
        server_error,
      ]

  - id: API_AUTH_EMAIL_LOGIN
    method: POST
    path: /auth/login
    description: 이메일과 비밀번호로 로그인한다.
    auth_required: false
    success_status: [200]
    error_cases:
      [
        network_error,
        validation_error,
        invalid_credentials,
        withdrawal_pending,
        server_error,
      ]

  - id: API_AUTH_LOGOUT
    method: POST
    path: /auth/logout
    description: 서버 세션 또는 refresh token을 폐기한다.
    auth_required: true
    success_status: [200]
    error_cases: [network_error, unauthorized, server_error]

  - id: API_AUTH_REFRESH_TOKEN
    method: POST
    path: /auth/tokens/refresh
    description: refresh token으로 access token을 갱신한다.
    auth_required: false
    success_status: [200]
    error_cases:
      [network_error, invalid_refresh_token, blocked_account, server_error]

  - id: API_AUTH_VERIFY_SIGNUP_EMAIL
    method: GET
    path: /auth/signup/email/verify
    description: 회원가입 이메일 사용 가능 여부를 확인한다.
    auth_required: false
    success_status: [200]
    error_cases:
      [network_error, duplicate_email, email_login_link_required, server_error]

  - id: API_AUTH_SEND_SIGNUP_EMAIL_OTP
    method: POST
    path: /auth/signup/email/otp/send
    description: 회원가입 이메일 OTP를 발송한다.
    auth_required: false
    success_status: [200]
    error_cases: [network_error, validation_error, rate_limited, server_error]

  - id: API_AUTH_VERIFY_SIGNUP_EMAIL_OTP
    method: POST
    path: /auth/signup/email/otp/verify
    description: 회원가입 이메일 OTP를 검증하고 signupToken을 발급한다.
    auth_required: false
    success_status: [200]
    error_cases: [network_error, invalid_code, expired_code, server_error]

  - id: API_AUTH_SEND_PASSWORD_EMAIL_OTP
    method: POST
    path: /auth/password/email/otp/send
    description: 비밀번호 재설정 이메일 OTP를 발송한다.
    auth_required: false
    success_status: [200]
    error_cases: [network_error, unknown_email, rate_limited, server_error]

  - id: API_AUTH_VERIFY_PASSWORD_EMAIL_OTP
    method: POST
    path: /auth/password/email/otp/verify
    description: 비밀번호 재설정 OTP를 검증하고 resetToken을 발급한다.
    auth_required: false
    success_status: [200]
    error_cases: [network_error, invalid_code, expired_code, server_error]

  - id: API_AUTH_RESET_PASSWORD
    method: PATCH
    path: /auth/password/reset
    description: resetToken으로 비밀번호를 재설정한다.
    auth_required: false
    success_status: [200]
    error_cases: [network_error, invalid_token, validation_error, server_error]

  - id: API_AUTH_SEND_EMAIL_LINK_OTP
    method: POST
    path: /auth/signup/email-link/otp/send
    description: 소셜 가입 이메일을 이메일 로그인과 연결하기 위한 OTP를 발송한다.
    auth_required: false
    success_status: [200]
    error_cases: [network_error, rate_limited, server_error]

  - id: API_AUTH_VERIFY_EMAIL_LINK_OTP
    method: POST
    path: /auth/signup/email-link/otp/verify
    description: 이메일 로그인 연결 OTP를 검증하고 emailLinkToken을 발급한다.
    auth_required: false
    success_status: [200]
    error_cases: [network_error, invalid_code, expired_code, server_error]

  - id: API_AUTH_SET_EMAIL_LINK_PASSWORD
    method: PATCH
    path: /auth/signup/email-link/password
    description: emailLinkToken으로 이메일 로그인 비밀번호를 설정한다.
    auth_required: false
    success_status: [200]
    error_cases: [network_error, invalid_token, validation_error, server_error]

  - id: API_AUTH_SEND_SOCIAL_LINK_EMAIL_OTP
    method: POST
    path: /auth/social-link/email/otp/send
    description: 소셜 로그인 계정 연결용 이메일 OTP를 발송한다.
    auth_required: false
    success_status: [200]
    error_cases:
      [network_error, invalid_social_link_token, rate_limited, server_error]

  - id: API_AUTH_VERIFY_SOCIAL_LINK_EMAIL_OTP
    method: POST
    path: /auth/social-link/email/otp/verify
    description: 소셜 로그인 계정 연결용 이메일 OTP를 검증한다.
    auth_required: false
    success_status: [200]
    error_cases: [network_error, invalid_code, expired_code, server_error]

  - id: API_AUTH_VERIFY_NICKNAME
    method: GET
    path: /auth/signup/nickname/verify
    description: 회원가입 또는 닉네임 수정 전 닉네임 사용 가능 여부를 확인한다.
    auth_required: false
    success_status: [200]
    error_cases:
      [network_error, duplicate_nickname, validation_error, server_error]

  - id: API_AUTH_SIGNUP
    method: POST
    path: /auth/signup
    description: signupToken, 비밀번호, 기본 프로필, 닉네임으로 계정을 생성한다.
    auth_required: false
    success_status: [200, 201]
    error_cases:
      [
        network_error,
        validation_error,
        duplicate_nickname,
        expired_signup_token,
        server_error,
      ]

  - id: API_AUTH_CANCEL_WITHDRAWAL
    method: POST
