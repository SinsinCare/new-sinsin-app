events:
  - id: app_launch_started
    description: 앱 실행 플로우가 시작됨
    owner: product

  - id: app_policy_checked
    description: 앱 실행 정책 확인이 완료됨
    owner: product

  - id: app_policy_blocked
    description: 앱 정책에 의해 사용이 차단됨
    owner: product

  - id: screen_viewed
    description: 사용자가 개인정보가 제거된 화면 범주를 봄
    owner: product

  - id: auth_session_restore_started
    description: 저장된 토큰으로 세션 복원을 시작함
    owner: product

  - id: auth_session_restore_failed
    description: 세션 복원에 실패함
    owner: product

  - id: auth_login_viewed
    description: 사용자가 로그인 화면을 봄
    owner: product

  - id: auth_email_login_started
    description: 사용자가 이메일 로그인을 시작함
    owner: product

  - id: auth_email_login_succeeded
    description: 이메일 로그인에 성공함
    owner: product

  - id: auth_email_login_failed
    description: 이메일 로그인에 실패함
    owner: product

  - id: auth_social_login_started
    description: 사용자가 소셜 로그인을 시작함
    owner: product

  - id: auth_social_login_succeeded
    description: 소셜 로그인에 성공함
    owner: product

  - id: auth_social_login_failed
    description: 소셜 로그인에 실패함
    owner: product

  - id: auth_signup_started
    description: 회원가입 플로우가 시작됨
    owner: product

  - id: auth_signup_email_verified
    description: 회원가입 이메일 OTP 인증에 성공함
    owner: product

  - id: auth_signup_completed
    description: 회원가입이 완료됨
    owner: product

  - id: auth_password_reset_started
    description: 비밀번호 재설정 플로우가 시작됨
    owner: product

  - id: auth_password_reset_completed
    description: 비밀번호 재설정이 완료됨
    owner: product

  - id: auth_withdrawal_cancelled
    description: 탈퇴 대기 계정의 탈퇴 취소가 완료됨
    owner: product

  - id: onboarding_started
    description: 온보딩 플로우가 시작됨
    owner: product

  - id: onboarding_steps_loaded
    description: CKD 여부에 맞는 온보딩 질문 목록을 불러옴
    owner: product

  - id: onboarding_answer_validation_failed
    description: 온보딩 답변 검증에 실패함
    owner: product

  - id: onboarding_submitted
    description: 온보딩 답변 제출에 성공함
    owner: product

  - id: onboarding_submit_failed
    description: 온보딩 답변 제출에 실패함
    owner: product

  - id: home_record_viewed
    description: 사용자가 홈 기록 탭을 봄
    owner: product

  - id: home_statistics_viewed
    description: 사용자가 홈 통계 탭을 봄
    owner: product

  - id: food_record_started
    description: 식사 기록 플로우가 시작됨
    owner: product

  - id: food_record_method_selected
    description: 사용자가 사진, 텍스트, 건너뛰기 중 기록 방식을 선택함
    owner: product

  - id: food_photo_permission_denied
    description: 음식 사진 촬영 또는 업로드 권한이 거부됨
    owner: product

  - id: food_analysis_started
    description: 음식 사진 또는 텍스트 분석이 시작됨
    owner: product

  - id: food_analysis_succeeded
    description: 음식 분석에 성공함
    owner: product

  - id: food_analysis_failed
    description: 음식 분석에 실패함
    owner: product

  - id: food_analysis_dismissed
    description: 사용자가 분석 중 로딩 화면을 닫음
    owner: product

  - id: food_record_saved
    description: 분석 결과를 식사 기록으로 저장함
    owner: product

  - id: food_record_save_failed
    description: 식사 기록 저장에 실패함
    owner: product

  - id: food_record_skipped
    description: 사용자가 식사를 건너뛰기로 기록함
    owner: product

  - id: profile_viewed
    description: 사용자가 My Page를 봄
    owner: product

  - id: profile_update_started
    description: 프로필 수정을 시작함
    owner: product

  - id: profile_update_succeeded
    description: 프로필 수정에 성공함
    owner: product

  - id: profile_update_failed
    description: 프로필 수정에 실패함
    owner: product

  - id: kidney_profile_update_succeeded
    description: 신장 프로필 수정에 성공함
    owner: product

  - id: password_change_succeeded
    description: 비밀번호 변경에 성공함
    owner: product

  - id: inquiry_submitted
    description: 문의 제출에 성공함
    owner: support

  - id: account_withdrawal_requested
    description: 회원탈퇴 요청이 제출됨
    owner: product

  - id: notification_settings_viewed
    description: 사용자가 알림 설정 화면을 봄
    owner: product

  - id: notification_permission_requested
    description: 알림 권한 요청이 발생함
    owner: product

  - id: notification_permission_denied
    description: 알림 권한이 거부됨
    owner: product

  - id: notification_settings_saved
    description: 알림 설정 저장에 성공함
    owner: product

  - id: notification_settings_save_failed
    description: 알림 설정 저장에 실패함
    owner: product

  - id: notification_opened
    description: 사용자가 알림을 탭해서 앱으로 진입함
    owner: product

  - id: error_retry_tapped
    description: 오류 상태에서 사용자가 재시도를 탭함
    owner: product
