name: EAS Build & Submit

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      environment:
        description: '빌드 환경'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - test
      platform:
        description: '빌드 플랫폼'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - ios
          - android
      submit:
        description: '스토어 자동 제출'
        required: true
        default: true
        type: boolean

jobs:
  build-and-submit:
    name: Build & Submit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      # 프로파일↔백엔드 짝을 빌드 전에 검사한다. 스토어에 나간 iOS 1.2.1 은
      # 테스트 백엔드를 보는 프로파일에서 나왔다 — 여기서 먼저 깨져야 한다.
      - name: Check release config
        run: npm run check:release-config

      - name: Build & Submit (tag push)
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          npm run check:release-config -- --profile production
          eas build \
            --platform all \
            --profile production \
            --auto-submit \
            --non-interactive

      - name: Build & Submit (manual trigger)
        if: github.event_name == 'workflow_dispatch'
        run: |
          PROFILE="${{ inputs.environment }}"
          if [ "$PROFILE" != "production" ] && [ "${{ inputs.submit }}" = "true" ]; then
            echo "Auto-submit is only allowed for production builds."
            exit 1
          fi
          if [ "${{ inputs.submit }}" = "true" ]; then
            eas build \
              --platform ${{ inputs.platform }} \
              --profile "$PROFILE" \
              --auto-submit \
              --non-interactive
          else
            eas build \
              --platform ${{ inputs.platform }} \
              --profile "$PROFILE" \
              --non-interactive
          fi
